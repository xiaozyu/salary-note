<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="薪資助理">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">
    
    <title>薪資助理</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            user-select: none; 
            -webkit-user-select: none; 
            -webkit-touch-callout: none; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        html, body { 
            overscroll-behavior: none;
            overscroll-behavior-y: none;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #0f172a; 
            color: #f8fafc; 
        }

        body { 
            padding: clamp(6px, 1.8vmin, 12px); 
            display: flex; 
            flex-direction: column; 
            height: 100dvh; 
            position: relative;
        }
        
        .screenshot-area {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            background-color: #0f172a;
        }

        .dashboard { 
            background: linear-gradient(135deg, #1e293b, #334155); 
            border-radius: 16px; 
            padding: 10px 12px; 
            margin-bottom: 6px; 
            border: 1px solid #475569; 
            flex-shrink: 0; 
        }
        
        .dash-flex { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            gap: 6px;
        }
        .dash-left-info {
            flex-shrink: 1;
            min-width: 0;
        }
        .dash-left-info #month-label {
            font-size: 11px; 
            opacity: 0.8; 
            font-weight: 700;
            white-space: nowrap;
        }
        .total-money { 
            font-size: clamp(20px, 4.8vmin, 26px); 
            font-weight: 800; 
            color: #38bdf8; 
            line-height: 1.1;
            white-space: nowrap;
        }
        
        .dash-right-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .history-btn-group {
            display: flex;
            gap: 3px;
            background: rgba(15, 23, 42, 0.7);
            padding: 2px 4px;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        .hist-btn {
            background: rgba(56, 189, 248, 0.08);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #38bdf8;
            width: 34px;
            height: 32px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }
        .hist-btn:active {
            background: #38bdf8;
            color: #0f172a;
        }
        .hist-btn:disabled {
            background: transparent;
            border-color: #334155;
            color: #475569;
            opacity: 0.3;
            cursor: not-allowed;
        }

        .note-toggle-btn { 
            background: rgba(56, 189, 248, 0.1); 
            border: 1px solid #38bdf8; 
            color: #38bdf8; 
            height: 36px;
            padding: 0 8px; 
            border-radius: 8px; 
            font-size: 12px; 
            font-weight: 700; 
            cursor: pointer; 
            transition: all 0.2s; 
            white-space: nowrap; 
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .note-toggle-btn.active { 
            background: #f59e0b; 
            border-color: #f59e0b; 
            color: #0f172a; 
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.6);
        }
        
        .config-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 6px; 
            margin-top: 8px; 
            padding-top: 8px; 
            border-top: 1px solid #475569; 
        }
        .config-box { display: flex; flex-direction: column; gap: 3px; }
        .config-box label { font-size: 11px; color: #94a3b8; font-weight: 700; text-align: center; }

        .config-input { 
            background: #0f172a; 
            border: 1px solid #475569; 
            border-radius: 8px; 
            color: #34d399; 
            padding: 6px 4px; 
            font-size: 14px; 
            font-weight: 700; 
            width: 100%; 
            text-align: center; 
            user-select: text !important; 
            -webkit-user-select: text !important; 
        }
        #tips-input { color: #f43f5e; cursor: default; }

        .stats { display: flex; gap: 8px; font-size: 12px; margin-top: 6px; opacity: 0.9; justify-content: space-between; font-weight: 600; }
        
        .main-layout { display: flex; flex-direction: column; flex: 1; min-height: 0; }
        
        .calendar-container { 
            flex: 1; 
            background: #1e293b; 
            border-radius: 18px; 
            padding: 8px; 
            display: flex; 
            flex-direction: column; 
            border: 1px solid #334155; 
            position: relative; 
            overflow: hidden; 
            min-height: 0; 
        }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 16px; margin-bottom: 6px; flex-shrink: 0; }
        
        .cal-btn { 
            background: #0f172a; 
            border: 1px solid #334155; 
            color: #94a3b8; 
            width: 38px; 
            height: 38px; 
            border-radius: 10px; 
            font-size: 16px; 
            font-weight: 800; 
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cal-btn:active { background: #38bdf8; color: #000; }
        #calendar-title { cursor: pointer; padding: 6px 12px; border-radius: 8px; }
        #calendar-title:active { background: rgba(56, 189, 248, 0.15); }

        .week-days { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 11px; color: #94a3b8; font-weight: 700; margin-bottom: 4px; flex-shrink: 0; }
        
        .days-grid { 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); 
            flex: 1; 
            gap: 4px; 
            height: 100%; 
            min-height: 0; 
            container-type: size;
        }
        
        .day-cell { 
            background: #0f172a; 
            border: 1px solid #334155; 
            border-radius: 8px; 
            position: relative; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            padding: 3px; 
            height: 100%; 
            min-height: 0; 
            container-type: size;
        }
        
        .day-cell.note-mode-target {
            border-color: #f59e0b !important;
            cursor: pointer;
        }

        .day-cell.single-bounce { animation: cellPopBounce 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 10; }
        @keyframes cellPopBounce { 0% { transform: scale(1); } 30% { transform: scale(1.12); box-shadow: 0 0 15px #38bdf8; } 50% { transform: scale(0.96); } 100% { transform: scale(1); } }

        .day-cell.today-box { border: 2px solid #38bdf8 !important; box-shadow: inset 0 0 6px rgba(56, 189, 248, 0.35); }
        .day-cell.today-box .day-num { color: #38bdf8 !important; font-weight: 900; }

        .cell-top { 
            display: flex; 
            flex-direction: column; 
            align-items: flex-start; 
            width: 100%; 
            z-index: 2; 
            gap: 1px; 
            flex-shrink: 0; 
        }
        .day-num-box { display: flex; align-items: center; gap: 2px; }
        .day-num { font-size: clamp(9px, 15cqw, 13px); font-weight: 800; color: #94a3b8; line-height: 1; }
        .weather-icon { font-size: clamp(8px, 12cqw, 11px); line-height: 1; }
        
        .holiday-name { 
            font-size: clamp(7.5px, 11cqw, 9.5px); 
            color: #fda4af; 
            background: rgba(225, 29, 72, 0.3); 
            border: 1px solid rgba(244, 63, 94, 0.5); 
            padding: 0 2px; 
            border-radius: 2px; 
            font-weight: 800; 
            word-break: break-all; 
            white-space: normal; 
            line-height: 1.05; 
            letter-spacing: -0.2px; 
            margin-top: 1px; 
            align-self: flex-start; 
        }

        .day-status { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            font-size: clamp(15px, 26cqw, 24px); 
            font-weight: 900; 
            text-align: center; 
            line-height: 1; 
            z-index: 1; 
            pointer-events: none; 
            width: 100%; 
        }

        .day-status.bounce-active { animation: popBounce 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popBounce { 0% { transform: translate(-50%, -50%) scale(1); } 30% { transform: translate(-50%, -50%) scale(1.3); } 50% { transform: translate(-50%, -50%) scale(0.9); } 100% { transform: translate(-50%, -50%) scale(1); } }

        .cell-bottom { 
            display: flex; 
            flex-direction: column; 
            width: 100%; 
            z-index: 2; 
            margin-top: auto; 
            gap: 1px; 
        }

        .day-note-badge { 
            width: 100%; 
            font-size: clamp(7.5px, 13cqw, 10.5px); 
            font-weight: 800; 
            color: #ffffff; 
            background: rgba(15, 23, 42, 0.95); 
            border: 1px solid rgba(148, 163, 184, 0.5); 
            padding: 1px 2px; 
            border-radius: 3px; 
            pointer-events: none; 
            word-break: break-all; 
            white-space: normal; 
            line-height: 1.15; 
            text-align: center; 
            display: -webkit-box; 
            -webkit-line-clamp: 3; 
            -webkit-box-orient: vertical; 
            overflow: hidden; 
            letter-spacing: -0.2px; 
        }

        .day-tips-badge { 
            font-size: 8.5px; 
            font-weight: 900; 
            color: #ffffff; 
            background: #e11d48; 
            padding: 0 3px; 
            border-radius: 2px; 
            white-space: nowrap; 
            line-height: 1.1; 
            align-self: center; 
        }

        .status-full .day-note-badge, .status-half .day-note-badge { background: rgba(0, 0, 0, 0.85); color: #fff; border-color: transparent; }
        .status-full { background: #00ff66 !important; border-color: #00ff66; } .status-full .day-num, .status-full .day-status { color: #000 !important; } 
        .status-half { background: #ffaa00 !important; border-color: #ffaa00; } .status-half .day-num, .status-half .day-status { color: #000 !important; } 
        .status-rain { background: #450a0a !important; border: 2px dashed #ef4444 !important; } .status-rain .day-num, .status-rain .day-status { color: #f87171; }
        .other-month { opacity: 0.08; pointer-events: none; }

        /* CS 戰術輪盤 */
        .radial-menu { display: none; position: fixed; width: 170px; height: 170px; z-index: 9999; transform: translate(-50%, -50%); pointer-events: none; }
        .radial-bg { position: absolute; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.96); border: 2px solid rgba(56, 189, 248, 0.4); border-radius: 50%; box-shadow: 0 10px 30px rgba(0,0,0,0.6); overflow: hidden; }
        .radial-line { position: absolute; top: 85px; left: 85px; width: 0px; height: 3px; background: #38bdf8; transform-origin: left center; box-shadow: 0 0 8px #38bdf8; z-index: 2; }
        .weapon-option { position: absolute; font-size: 13px; font-weight: 800; color: #64748b; display: flex; align-items: center; justify-content: center; width: 62px; height: 44px; text-align: center; z-index: 5; white-space: nowrap; transition: transform 0.12s cubic-bezier(0.175, 0.885, 0.32, 1.275), color 0.1s, font-size 0.1s, opacity 0.1s; }
        
        .opt-full { top: 8px; left: 54px; } 
        .opt-half { top: 32px; right: 4px; } 
        .opt-tips { bottom: 32px; right: 4px; color: #fda4af; } 
        .opt-rain { bottom: 8px; left: 54px; } 
        .opt-clear { top: 63px; left: 4px; color: #94a3b8; }   

        .weapon-option.highlight { color: #22d3ee !important; font-size: 20px !important; text-shadow: 0 0 20px #06b6d4, 0 0 40px #06b6d4; opacity: 1 !important; z-index: 999; }
        .opt-full.highlight  { transform: translateY(-8px); } 
        .opt-half.highlight  { transform: translate(6px, -6px); } 
        .opt-tips.highlight  { transform: translate(6px, 6px); color: #f43f5e !important; text-shadow: 0 0 20px #ef4444; } 
        .opt-rain.highlight  { transform: translateY(8px); } 
        .opt-clear.highlight { transform: translateX(-8px); color: #f43f5e !important; text-shadow: 0 0 20px #ef4444; }
        
        .drawer-mask { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(2px); z-index: 10001; display: none; opacity: 0; transition: opacity 0.2s; }
        .drawer-mask.show { display: block; opacity: 1; }

        /* 抽屜樣式 */
        .note-drawer { position: fixed; bottom: -340px; left: 0; right: 0; background: #1e293b; border-top: 1px solid #475569; border-radius: 20px 20px 0 0; padding: 18px 16px; z-index: 10002; transition: bottom 0.25s cubic-bezier(0.1, 0.9, 0.2, 1); }
        .note-drawer.show { bottom: 0; }
        .drawer-title { font-size: 15px; font-weight: 700; color: #38bdf8; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .quick-tags { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 14px; padding-bottom: 4px; align-items: center; }
        .tag-btn { background: #0f172a; border: 1px solid #334155; color: #cbd5e1; height: 36px; padding: 0 12px; border-radius: 8px; font-size: 13px; font-weight: 600; white-space: nowrap; flex-shrink: 0; }
        .tag-btn:active { background: #38bdf8; color: #000; }
        .tag-add-btn { background: rgba(56, 189, 248, 0.15); border: 1px dashed #38bdf8; color: #38bdf8; width: 36px; height: 36px; border-radius: 8px; font-size: 18px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        
        .drawer-input { width: 100%; height: 46px; background: #0f172a; border: 1px solid #334155; color: #fff; padding: 0 12px; border-radius: 10px; font-size: 15px; margin-bottom: 14px; user-select: text !important; -webkit-user-select: text !important; }
        .drawer-actions { display: flex; gap: 10px; }
        .drawer-btn { flex: 1; height: 46px; border-radius: 10px; font-weight: 700; font-size: 14px; border: none; cursor: pointer; }
        .btn-confirm { background: #38bdf8; color: #0f172a; }
        .btn-clear { background: #334155; color: #f43f5e; }

        .tips-picker-drawer { position: fixed; bottom: -440px; left: 0; right: 0; background: #1e293b; border-top: 1px solid #f43f5e; border-radius: 20px 20px 0 0; padding: 18px 16px; z-index: 10002; transition: bottom 0.25s cubic-bezier(0.1, 0.9, 0.2, 1); }
        .tips-picker-drawer.show { bottom: 0; }
        
        .wheel-container {
            position: relative;
            height: 120px;
            overflow: hidden;
            margin: 8px 0 14px 0;
            background: #0f172a;
            border-radius: 12px;
            border: 1px solid #334155;
        }
        .wheel-highlight {
            position: absolute;
            top: 40px;
            left: 0;
            right: 0;
            height: 40px;
            background: rgba(244, 63, 94, 0.15);
            border-top: 1px solid rgba(244, 63, 94, 0.6);
            border-bottom: 1px solid rgba(244, 63, 94, 0.6);
            pointer-events: none;
            z-index: 2;
        }
        .wheel-scroll {
            height: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
            padding: 40px 0;
        }
        .wheel-scroll::-webkit-scrollbar { display: none; }
        .wheel-item {
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 800;
            color: #64748b;
            scroll-snap-align: center;
            transition: color 0.1s, transform 0.1s;
        }
        .wheel-item.selected {
            color: #f43f5e;
            font-size: 19px;
            transform: scale(1.08);
        }

        #toast { 
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); 
            background: rgba(15, 23, 42, 0.92); border: 1px solid rgba(56, 189, 248, 0.5); color: #38bdf8; 
            padding: 8px 24px; border-radius: 50px; font-size: 13px; opacity: 0; 
            transition: opacity 0.2s; pointer-events: none; z-index: 10000; font-weight: 700; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .physics-particle { position: fixed; pointer-events: none; z-index: 99999; font-weight: 900; display: flex; align-items: center; justify-content: center; border-radius: 6px; }
        
        .coin-particle {
            position: fixed;
            pointer-events: none;
            z-index: 100000;
            font-size: 22px;
            line-height: 1;
        }
    </style>
</head>
<body>

    <div id="capture-zone" class="screenshot-area">
        <div class="dashboard">
            <div class="dash-flex">
                <div class="dash-left-info">
                    <div id="month-label">2026年 08月 累積薪資</div>
                    <div class="total-money" id="total-salary">$0</div>
                </div>
                <div class="dash-right-group">
                    <div class="history-btn-group">
                        <button class="hist-btn" id="undo-btn" onclick="triggerUndo()" title="復原上一動" disabled>↩</button>
                        <button class="hist-btn" id="redo-btn" onclick="triggerRedo()" title="重做下一動" disabled>↪</button>
                    </div>
                    <button class="note-toggle-btn" id="note-mode-btn" onclick="toggleNoteMode()">✍️ 註記</button>
                </div>
            </div>
            <div class="config-grid">
                <div class="config-box"><label>💰 基礎日薪</label><input type="number" id="base-wage-input" class="config-input" value="3000" oninput="updateSalaryConfig()" onfocus="if(this.value=='3000'||this.value=='0')this.value=''" onblur="if(this.value=='')this.value='3000'; updateSalaryConfig();"></div>
                <div class="config-box"><label>🪪 證照加給</label><input type="number" id="bonus-input" class="config-input" value="0" oninput="updateSalaryConfig()" onfocus="if(this.value=='0')this.value=''" onblur="if(this.value=='')this.value='0'; updateSalaryConfig();"></div>
                <div class="config-box">
                    <label>🧧 當月小費</label>
                    <input type="text" id="tips-input" class="config-input" value="$0" readonly>
                </div>
            </div>
            <div class="stats"><span id="stat-full">🟢 全: 0天</span><span id="stat-half">🟡 半: 0天</span><span id="stat-rain">🌧️ 雨: 0天</span></div>
        </div>

        <div class="main-layout">
            <div class="calendar-container" id="calendar-container">
                <div class="calendar-header"><button class="cal-btn" onclick="changeMonth(-1)">◀</button><span id="calendar-title" onclick="handleTitleClick()">2026年06月</span><button class="cal-btn" onclick="changeMonth(1)">▶</button></div>
                <div class="week-days"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div>
                <div class="days-grid" id="days-grid"></div>
            </div>
        </div>
    </div>
    
    <!-- 戰術輪盤 -->
    <div class="radial-menu" id="radial-menu">
        <div class="radial-bg"></div>
        <div class="radial-line" id="radial-line"></div>
        <div class="weapon-option opt-full" id="opt-full">🟢 全天</div>
        <div class="weapon-option opt-half" id="opt-half">🟡 半天</div>
        <div class="weapon-option opt-tips" id="opt-tips">🧧 小費</div>
        <div class="weapon-option opt-rain" id="opt-rain">🌧️ 雨天</div>
        <div class="weapon-option opt-clear" id="opt-clear">🧹 清除</div>
    </div>

    <!-- 抽屜共用遮罩 -->
    <div class="drawer-mask" id="drawer-mask" onclick="closeAllDrawers()"></div>

    <!-- 註記抽屜 -->
    <div class="note-drawer" id="note-drawer">
        <div class="drawer-title"><span id="drawer-date-label">編輯註記</span><span onclick="closeAllDrawers()" style="cursor:pointer; font-size: 20px; padding: 4px 8px;">✕</span></div>
        <div class="quick-tags" id="quick-tags-bar">
            <!-- 動態產生自訂標籤 -->
        </div>
        <input type="text" id="drawer-note-input" class="drawer-input" placeholder="輸入註記內容...">
        <div class="drawer-actions">
            <button class="drawer-btn btn-clear" onclick="clearNote()">清除註記</button>
            <button class="drawer-btn btn-confirm" onclick="saveNote()">確認儲存</button>
        </div>
    </div>

    <!-- 小費輸入抽屜 -->
    <div class="tips-picker-drawer" id="tips-picker-drawer">
        <div class="drawer-title"><span id="tips-drawer-date-label" style="color:#f43f5e;">設定小費金額</span><span onclick="closeAllDrawers()" style="cursor:pointer; font-size: 20px; padding: 4px 8px;">✕</span></div>
        <input type="number" id="tips-manual-input" class="drawer-input" placeholder="輸入小費金額 (例如: 500, 1500)..." oninput="onTipsManualInput(this.value)">
        <div class="wheel-container">
            <div class="wheel-highlight"></div>
            <div class="wheel-scroll" id="wheel-scroll" onscroll="onWheelScroll()"></div>
        </div>
        <div class="drawer-actions">
            <button class="drawer-btn btn-clear" onclick="clearTips()">清空小費</button>
            <button class="drawer-btn btn-confirm" style="background:#f43f5e; color:#fff;" onclick="confirmTipsSelection()">確認小費</button>
        </div>
    </div>
    
    <div id="toast">儲存成功</div>

    <script>
        document.addEventListener('touchmove', function(e) {
            if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });

        let holidaysCache = {};
        let weatherCache = {};
        let isNoteModeActive = false;

        const lunarHolidaysFallback = {
            2025: { "2025-01-28": "除夕", "2025-01-29": "初一", "2025-01-30": "初二", "2025-01-31": "初三", "2025-04-04": "清明節", "2025-05-31": "端午節", "2025-10-06": "中秋節" },

        const todayObj = new Date();
        let currentYear = todayObj.getFullYear();
        let currentMonth = todayObj.getMonth();
        const todayStr = currentYear + "-" + String(currentMonth + 1).padStart(2, '0') + "-" + String(todayObj.getDate()).padStart(2, '0');

        let workRecords = JSON.parse(localStorage.getItem('cs_work_records')) || {};
        let monthlyConfigs = JSON.parse(localStorage.getItem('cs_monthly_configs')) || {};
        let customTags = JSON.parse(localStorage.getItem('cs_custom_tags')) || ['點工', '加班', '夜班', '扣款', '借支'];

        let menuActive = false, menuCenterX = 0, menuCenterY = 0, activeDateStr = '', currentSelection = '', hasMovedFar = false;

        let justSelectedDate = ''; 
        let isExploding = false;

        let currentWheelValue = 0;
        let lastScrolledIndex = -1;

        let clickCount = 0;

        let undoStack = [];
        let redoStack = [];

        function getCurrentMonthKey() {
            return currentYear + "-" + String(currentMonth + 1).padStart(2, '0');
        }

        function getMonthConfig(mKey) {
            if (!monthlyConfigs[mKey]) {
                const legacyBase = Number(localStorage.getItem('cs_base_wage')) || 3000;
                const legacyBonus = Number(localStorage.getItem('cs_cert_bonus')) || 0;
                monthlyConfigs[mKey] = { base: legacyBase, bonus: legacyBonus };
            }
            return monthlyConfigs[mKey];
        }

        function pushHistory() {
            undoStack.push(JSON.stringify(workRecords));
            if (undoStack.length > 30) undoStack.shift();
            redoStack = [];
            updateHistoryButtons();
        }

        function triggerUndo() {
            if (undoStack.length === 0) return;
            haptic(20);
            redoStack.push(JSON.stringify(workRecords));
            const prev = undoStack.pop();
            workRecords = JSON.parse(prev);
            localStorage.setItem('cs_work_records', JSON.stringify(workRecords));
            updateHistoryButtons();
            renderCalendar();
            showToast('↩ 已復原上一動');
        }

        function triggerRedo() {
            if (redoStack.length === 0) return;
            haptic(20);
            undoStack.push(JSON.stringify(workRecords));
            const next = redoStack.pop();
            workRecords = JSON.parse(next);
            localStorage.setItem('cs_work_records', JSON.stringify(workRecords));
            updateHistoryButtons();
            renderCalendar();
            showToast('↪ 已重做下一動');
        }

        function updateHistoryButtons() {
            document.getElementById('undo-btn').disabled = undoStack.length === 0;
            document.getElementById('redo-btn').disabled = redoStack.length === 0;
        }

        function haptic(ms = 15) {
            if (navigator.vibrate) navigator.vibrate(ms);
        }

        function init() { 
            syncConfigInputs();
            buildWheelItems();
            renderTagBar();
            initSwipeGesture();
            
            ensureBaseHolidays(currentYear);
            renderCalendar(); 
            fetchTaichungWeather();
            updateHistoryButtons();

            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('./sw.js').catch(err => console.error('SW Error:', err));
                });
            }
        }

        function syncConfigInputs() {
            const mKey = getCurrentMonthKey();
            const conf = getMonthConfig(mKey);
            document.getElementById('base-wage-input').value = conf.base;
            document.getElementById('bonus-input').value = conf.bonus;
        }

        function buildWheelItems() {
            const wheel = document.getElementById('wheel-scroll');
            wheel.innerHTML = '';
            for (let val = 0; val <= 99000; val += 1000) {
                const el = document.createElement('div');
                el.className = 'wheel-item';
                el.dataset.val = val;
                el.innerText = val === 0 ? '$0 (無小費)' : `+$${val.toLocaleString()}`;
                wheel.appendChild(el);
            }
        }

        function renderTagBar() {
            const bar = document.getElementById('quick-tags-bar');
            bar.innerHTML = '';
            customTags.forEach(t => {
                const b = document.createElement('button');
                b.className = 'tag-btn';
                b.innerText = t;
                b.onclick = () => appendTag(t);
                b.oncontextmenu = (e) => {
                    e.preventDefault();
                    removeTag(t);
                };
                bar.appendChild(b);
            });

            const addBtn = document.createElement('button');
            addBtn.className = 'tag-add-btn';
            addBtn.innerText = '➕';
            addBtn.onclick = promptAddTag;
            bar.appendChild(addBtn);
        }

        function promptAddTag() {
            haptic(15);
            const name = prompt('請輸入欲新增的快捷標籤名稱：');
            if (name && name.trim()) {
                const val = name.trim();
                if (!customTags.includes(val)) {
                    customTags.push(val);
                    localStorage.setItem('cs_custom_tags', JSON.stringify(customTags));
                    renderTagBar();
                    showToast(`✅ 已新增快捷按鍵：${val}`);
                }
            }
        }

        function removeTag(tagName) {
            haptic(20);
            if (confirm(`確定要刪除「${tagName}」快捷標籤嗎？`)) {
                customTags = customTags.filter(t => t !== tagName);
                localStorage.setItem('cs_custom_tags', JSON.stringify(customTags));
                renderTagBar();
                showToast(`🗑️ 已刪除標籤：${tagName}`);
            }
        }

        function resetAllModes() {
            isNoteModeActive = false;
            const noteBtn = document.getElementById('note-mode-btn');
            if (noteBtn) {
                noteBtn.classList.remove('active');
                noteBtn.innerText = '✍️ 註記';
            }
        }

        function toggleNoteMode() {
            haptic(20);
            isNoteModeActive = !isNoteModeActive;
            const btn = document.getElementById('note-mode-btn');
            if (isNoteModeActive) {
                btn.classList.add('active');
                btn.innerText = '✍️ 註記中';
                showToast('✏️ 點選任一日期新增/編輯註記');
            } else {
                btn.classList.remove('active');
                btn.innerText = '✍️ 註記';
                showToast('已關閉註記模式');
            }
            renderCalendar();
        }

        function ensureBaseHolidays(year) {
            if (!holidaysCache[year]) {
                holidaysCache[year] = {
                    [`${year}-01-01`]: "元旦",
                    [`${year}-02-28`]: "二二八",
                    [`${year}-04-04`]: "兒童節",
                    [`${year}-05-01`]: "勞動節",
                    [`${year}-10-10`]: "國慶日"
                };
                if (lunarHolidaysFallback[year]) {
                    Object.assign(holidaysCache[year], lunarHolidaysFallback[year]);
                }
            }
        }

        async function fetchTaichungWeather() {
            try {
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=24.1477&longitude=120.6736&daily=weather_code&timezone=Asia%2FTaipei');
                if (res.ok) {
                    const data = await res.json();
                    data.daily.time.forEach((dateStr, idx) => {
                        const code = data.daily.weather_code[idx];
                        weatherCache[dateStr] = getWeatherEmoji(code);
                    });
                    renderCalendar();
                }
            } catch (e) {}
        }

        function getWeatherEmoji(code) {
            if (code === 0) return '☀️';
            if (code >= 1 && code <= 3) return '⛅';
            if (code >= 51 && code <= 67) return '🌧️';
            if (code >= 80 && code <= 82) return '🌧️';
            if (code >= 95) return '⛈️';
            return '☁️';
        }

        function updateSalaryConfig() { 
            const mKey = getCurrentMonthKey();
            const bWage = Number(document.getElementById('base-wage-input').value) || 0; 
            const cBonus = Number(document.getElementById('bonus-input').value) || 0; 
            
            monthlyConfigs[mKey] = { base: bWage, bonus: cBonus };
            localStorage.setItem('cs_monthly_configs', JSON.stringify(monthlyConfigs));
            
            // 僅重新計算「當月」工資，不污染前幾個月歷史
            for (let d in workRecords) { 
                if (d.startsWith(mKey)) {
                    if (workRecords[d].status === '全天') workRecords[d].wage = bWage; 
                    if (workRecords[d].status === '半天') workRecords[d].wage = bWage / 2; 
                }
            } 
            localStorage.setItem('cs_work_records', JSON.stringify(workRecords)); 
            renderCalendar(); 
        }
        
        function renderCalendar() {
            if (isExploding) return;
            const grid = document.getElementById('days-grid'); 
            grid.innerHTML = '';
            
            const mStr = String(currentMonth + 1).padStart(2, '0');
            document.getElementById('calendar-title').innerText = currentYear + "年" + mStr + "月";
            document.getElementById('month-label').innerText = currentYear + "年 " + mStr + "月 累積薪資";
            
            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();
            const prevMonthTotalDays = new Date(currentYear, currentMonth, 0).getDate();
            
            const totalSlots = firstDay + totalDays;
            const rowCount = Math.ceil(totalSlots / 7);
            grid.style.gridTemplateRows = `repeat(${rowCount}, 1fr)`;
            
            for (let i = firstDay - 1; i >= 0; i--) { 
                const cell = document.createElement('div'); 
                cell.className = 'day-cell other-month'; 
                cell.innerHTML = '<div class="cell-top"><div class="day-num-box"><span class="day-num">' + (prevMonthTotalDays - i) + '</span></div></div>'; 
                grid.appendChild(cell); 
            }

            const yHolidays = holidaysCache[currentYear] || {};

            for (let day = 1; day <= totalDays; day++) {
                const standardKey = currentYear + "-" + mStr + "-" + String(day).padStart(2, '0');
                const rec = workRecords[standardKey] || { status: '', wage: 0, tips: 0, note: '' };
                
                let holidayName = yHolidays[standardKey] || '';
                const holidayHtml = holidayName ? `<div class="holiday-name">${holidayName}</div>` : '';
                const weatherIcon = weatherCache[standardKey] ? `<span class="weather-icon">${weatherCache[standardKey]}</span>` : '';

                const cell = document.createElement('div'); 
                cell.className = 'day-cell'; 
                cell.dataset.date = standardKey;
                
                if (standardKey === todayStr) cell.classList.add('today-box');
                if (isNoteModeActive) cell.classList.add('note-mode-target');

                cell.onclick = (e) => {
                    if (isNoteModeActive) {
                        openNoteDrawer(standardKey);
                    }
                };

                if (rec.status === '全天') cell.classList.add('status-full'); 
                if (rec.status === '半天') cell.classList.add('status-half'); 
                if (rec.status === '下雨停工') cell.classList.add('status-rain');
                
                let shortStatus = rec.status === '全天' ? '全' : (rec.status === '半天' ? '半' : (rec.status === '下雨停工' ? '雨' : ''));
                let tBadge = (rec.tips && rec.tips > 0) ? `<span class="day-tips-badge">+${rec.tips}</span>` : '';
                let nBadge = (rec.note && rec.note.trim() !== '') ? `<div class="day-note-badge">${rec.note}</div>` : '';
                
                let bounceClass = (standardKey === justSelectedDate && shortStatus !== '') ? 'bounce-active' : '';
                if (standardKey === justSelectedDate) cell.classList.add('single-bounce');

                cell.innerHTML = `
                    <div class="cell-top">
                        <div class="day-num-box"><span class="day-num">${day}</span>${weatherIcon}</div>
                        ${holidayHtml}
                    </div>
                    <span class="day-status ${bounceClass}">${shortStatus}</span>
                    <div class="cell-bottom">
                        ${nBadge}
                        ${tBadge}
                    </div>
                `;
                
                cell.addEventListener('touchstart', function(e) { 
                    if(isNoteModeActive || isExploding || e.touches.length > 1) return; 
                    menuActive = true; 
                    hasMovedFar = false; 
                    lastVibratedOption = '';
                    activeDateStr = this.dataset.date; 
                    menuCenterX = e.touches[0].clientX; 
                    menuCenterY = e.touches[0].clientY; 
                    openRadialMenu(menuCenterX, menuCenterY); 
                }, { passive: true });

                grid.appendChild(cell);
            }
            justSelectedDate = ''; 
            calculateStats();
        }

        function initSwipeGesture() {
            const container = document.getElementById('calendar-container');
            let startX = 0, startY = 0;
            container.addEventListener('touchstart', (e) => {
                if (menuActive || isNoteModeActive) return;
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            }, { passive: true });

            container.addEventListener('touchend', (e) => {
                if (menuActive || hasMovedFar || isNoteModeActive) return;
                let diffX = e.changedTouches[0].clientX - startX;
                let diffY = e.changedTouches[0].clientY - startY;
                if (Math.abs(diffX) > 60 && Math.abs(diffY) < 40) {
                    haptic(20);
                    if (diffX > 0) changeMonth(-1);
                    else changeMonth(1);
                }
            }, { passive: true });
        }

        function openTipsPickerDrawer(dateStr) {
            haptic(25);
            editingDateStr = dateStr;

        function onTipsManualInput(val) {
            const num = Number(val) || 0;
            currentWheelValue = num;
            const wheel = document.getElementById('wheel-scroll');
            const targetIndex = Math.min(99, Math.max(0, Math.round(num / 1000)));
            wheel.scrollTop = targetIndex * 40;
            updateWheelHighlight(targetIndex);

        function onWheelScroll() {
            const wheel = document.getElementById('wheel-scroll');
            const index = Math.round(wheel.scrollTop / 40);
            if (index !== lastScrolledIndex && index >= 0 && index <= 99) {
                lastScrolledIndex = index;
                haptic(10);
                updateWheelHighlight(index);
                const input = document.getElementById('tips-manual-input');
                if (document.activeElement !== input) {
                    input.value = currentWheelValue > 0 ? currentWheelValue : '';
                }
            }
        }

        function updateWheelHighlight(selectedIndex) {
            const items = document.querySelectorAll('.wheel-item');
            items.forEach((item, idx) => {
                if (idx === selectedIndex) {
                    item.classList.add('selected');
                    currentWheelValue = Number(item.dataset.val);
                } else {
                    item.classList.remove('selected');
                }
            });
        }

            pushHistory();
            const manualVal = Number(document.getElementById('tips-manual-input').value);

            if (!workRecords[editingDateStr]) workRecords[editingDateStr] = { status: '', wage: 0, tips: 0, note: '' };
            workRecords[editingDateStr].tips = finalVal;
            localStorage.setItem('cs_work_records', JSON.stringify(workRecords));

        function clearTips() {
            pushHistory();
            if (workRecords[editingDateStr]) {
                workRecords[editingDateStr].tips = 0;
                localStorage.setItem('cs_work_records', JSON.stringify(workRecords));
            }
            document.getElementById('drawer-mask').classList.remove('show');
            document.getElementById('tips-picker-drawer').classList.remove('show');
            justSelectedDate = editingDateStr;
            resetAllModes();
            renderCalendar();
            showToast('🧹 已清除當日小費');

        function spawnCoinSpray(originX, originY) {
            const coinCount = 10;
            for (let i = 0; i < coinCount; i++) {
                const el = document.createElement('div');
                el.className = 'coin-particle';
                el.innerText = '🪙';
                document.body.appendChild(el);

                let x = originX;
                let y = originY;
                let vx = (Math.random() - 0.5) * 8;
                let vy = -(Math.random() * 6 + 4);
                let gravity = 0.45;
                let opacity = 1;
                let scale = 1;

                function coinLoop() {
                    vy += gravity;
                    x += vx;
                    y += vy;
                    scale = Math.max(0.4, scale - 0.015);
                    opacity -= 0.025;

                    el.style.transform = `translate3d(${x}px, ${y}px, 0) scale(${scale})`;
                    el.style.opacity = Math.max(0, opacity);

                    if (opacity > 0) {
                        requestAnimationFrame(coinLoop);
                    } else {
                        el.remove();
                    }
                }
                requestAnimationFrame(coinLoop);
            }
        }

        function handleTitleClick() {
            if (isExploding) return;
            const mStr = String(currentMonth + 1).padStart(2, '0');
            const prefix = currentYear + "-" + mStr;
            let hasData = false;
            for (let d in workRecords) { if (d.indexOf(prefix) === 0) { hasData = true; break; } }
            if (!hasData) return;

            clickCount++;
            haptic(15);
            clearTimeout(clickTimeout);
            clickTimeout = setTimeout(() => { clickCount = 0; }, 1500);

            if (clickCount >= 5 && clickCount < 10) {
                let remaining = 10 - clickCount;
                showToast(`⚠️ 欄位即將碎裂！再按 ${remaining} 次全數清除`);
            } else if (clickCount >= 10) {
                clickCount = 0;
                haptic([100, 50, 150]);
                triggerTitleExplosion(prefix);
            }
        }

        function triggerTitleExplosion(monthPrefix) {
            pushHistory();
            isExploding = true;
            const cells = document.querySelectorAll('.day-cell:not(.other-month)');
            const particles = [];
            const screenHeight = window.innerHeight;

            cells.forEach(cell => {
                const statusEl = cell.querySelector('.day-status');
                const badgeEl = cell.querySelector('.day-tips-badge');
                const noteEl = cell.querySelector('.day-note-badge');
                
                if (statusEl && statusEl.innerText.trim() !== '') {
                    particles.push(createParticleElement(statusEl.innerText, statusEl.getBoundingClientRect(), cell));
                    statusEl.style.opacity = '0';
                }
                if (badgeEl) {
                    particles.push(createParticleElement(badgeEl.innerText, badgeEl.getBoundingClientRect(), null, true));
                    badgeEl.style.opacity = '0';
                }
                if (noteEl) noteEl.style.opacity = '0';
                cell.className = 'day-cell';
            });

            let startTime = null;
            function physLoop(timestamp) {
                if (!startTime) startTime = timestamp;
                let progress = timestamp - startTime;

                particles.forEach(p => {
                    p.vy += p.gravity; p.x += p.vx; p.y += p.vy; p.rot += p.vRot;
                    const bottomLimit = screenHeight - p.height - 10;
                    if (p.y > bottomLimit) { p.y = bottomLimit; p.vy = -p.vy * p.bounce; p.vx *= 0.8; }
                    p.el.style.transform = `translate3d(${p.x}px, ${p.y}px, 0) rotate(${p.rot}deg)`;
                    if (progress > 500) p.el.style.opacity = Math.max(0, 1 - (progress - 500) / 500);
                });

                if (progress < 1000) { requestAnimationFrame(physLoop); } else {
                    particles.forEach(p => p.el.remove());
                    for (let d in workRecords) { if (d.indexOf(monthPrefix) === 0) delete workRecords[d]; }
                    localStorage.setItem('cs_work_records', JSON.stringify(workRecords));
                    isExploding = false;
                    renderCalendar();
                    showToast('🧹 已清空當月工時紀錄');
                }
            }
            requestAnimationFrame(physLoop);
        }

        function createParticleElement(text, rect, cellObj, isBadge = false) {
            const el = document.createElement('div'); el.className = 'physics-particle'; el.innerText = text;
            el.style.left = '0px'; el.style.top = '0px'; el.style.width = rect.width + 'px'; el.style.height = rect.height + 'px';
            el.style.transform = `translate3d(${rect.left}px, ${rect.top}px, 0)`;
            if (isBadge) { el.style.background = '#e11d48'; el.style.color = '#ffffff'; el.style.fontSize = '9.5px'; } 
            else if (cellObj) {
                if (cellObj.classList.contains('status-full')) { el.style.background = '#00ff66'; el.style.color = '#000000'; }
                else if (cellObj.classList.contains('status-half')) { el.style.background = '#ffaa00'; el.style.color = '#000000'; }
                else if (cellObj.classList.contains('status-rain')) { el.style.background = '#450a0a'; el.style.color = '#f87171'; }
                el.style.fontSize = '18px';
            }
            document.body.appendChild(el);
            return { el: el, x: rect.left, y: rect.top, width: rect.width, height: rect.height, vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.8) * 6, gravity: 0.4, bounce: 0.55, rot: 0, vRot: (Math.random() - 0.5) * 15 };
        }

        document.addEventListener('touchmove', function(e) {
            if (!menuActive || e.touches.length > 1) return; 
            const dx = e.touches[0].clientX - menuCenterX, dy = e.touches[0].clientY - menuCenterY;
            const distance = Math.sqrt(dx*dx + dy*dy);
            
            if (distance > 10) { 
                const angle = Math.atan2(dy, dx); 
                const len = Math.min(distance, 85); 
                const line = document.getElementById('radial-line'); 
                line.style.width = len + 'px'; 
                line.style.transform = `rotate(${angle}rad)`; 
            } else { 
                document.getElementById('radial-line').style.width = '0px'; 
            }

            if (distance > 28) { 
                hasMovedFar = true; 
                document.querySelectorAll('.weapon-option').forEach(el => { el.classList.remove('highlight'); el.style.opacity = '0.25'; }); 
                
                const deg = Math.atan2(dy, dx) * (180 / Math.PI);

                if (deg >= -135 && deg < -45) {
                    currentSelection = '全天';
                    document.getElementById('opt-full').classList.add('highlight');
                } else if (deg >= -45 && deg < 0) {
                    currentSelection = '半天';
                    document.getElementById('opt-half').classList.add('highlight');
                } else if (deg >= 0 && deg < 45) {
                    currentSelection = '小費';
                    document.getElementById('opt-tips').classList.add('highlight');
                } else if (deg >= 45 && deg < 135) {
                    currentSelection = '下雨停工';
                    document.getElementById('opt-rain').classList.add('highlight');
                } else {
                    currentSelection = '清除';
                    document.getElementById('opt-clear').classList.add('highlight');
                }

                if (currentSelection !== lastVibratedOption) {
                    haptic(15);
                    lastVibratedOption = currentSelection;
                }
            } else { 
                currentSelection = ''; 
                lastVibratedOption = '';
                document.querySelectorAll('.weapon-option').forEach(el => { el.classList.remove('highlight'); el.style.opacity = '1'; }); 
            }
        }, { passive: true });

        document.addEventListener('touchend', function() {
            if (!menuActive) return; 
            menuActive = false; 
            document.getElementById('radial-menu').style.display = 'none';
            
            if (!hasMovedFar) return;
            
            if (currentSelection === '小費') {
                haptic(25);
                openTipsPickerDrawer(activeDateStr);
                currentSelection = '';
                return;
            }

            pushHistory();
            if (!workRecords[activeDateStr]) workRecords[activeDateStr] = { status: '', wage: 0, tips: 0, note: '' };
            justSelectedDate = activeDateStr;
            
            const mKey = activeDateStr.substring(0, 7);
            const conf = getMonthConfig(mKey);
            const targetBase = conf.base;

            if (currentSelection === '清除') { 
                haptic(30);
                delete workRecords[activeDateStr]; 
                justSelectedDate = ''; 
                saveAndRefresh('🧹 已清除紀錄'); 
            } else if (currentSelection === '全天') { 
                haptic(20);
                workRecords[activeDateStr].status = '全天'; 
                workRecords[activeDateStr].wage = targetBase; 
                saveAndRefresh('🟢 已記全天'); 
            } else if (currentSelection === '半天') { 
                haptic(20);
                workRecords[activeDateStr].status = '半天'; 
                workRecords[activeDateStr].wage = targetBase / 2; 
                saveAndRefresh('🟡 已記半天'); 
            } else if (currentSelection === '下雨停工') { 
                haptic(20);
                workRecords[activeDateStr].status = '下雨停工'; 
                workRecords[activeDateStr].wage = 0; 
                saveAndRefresh('🌧️ 已記下雨停工'); 
            }
            currentSelection = '';
        });

        function openRadialMenu(x, y) { 
            const m = document.getElementById('radial-menu'); 
            m.style.left = x + 'px'; 
            m.style.top = y + 'px'; 
            m.style.display = 'block'; 
            document.getElementById('radial-line').style.width = '0px'; 
            document.querySelectorAll('.weapon-option').forEach(el => { el.classList.remove('highlight'); el.style.opacity = '1'; }); 
        }

        function saveAndRefresh(msg) { 
            localStorage.setItem('cs_work_records', JSON.stringify(workRecords)); 
            renderCalendar(); 
            showToast(msg); 
        }
        
        function calculateStats() {
            let wageT = 0, f = 0, h = 0, r = 0, gTips = 0; 
            const mKey = getCurrentMonthKey();
            const conf = getMonthConfig(mKey);

            for (let d in workRecords) { 
                if (d.indexOf(mKey) === 0) { 
                    const rec = workRecords[d]; 
                    if (rec.status === '全天') { wageT += rec.wage; f++; } 
                    if (rec.status === '半天') { wageT += rec.wage; h++; } 
                    if (rec.status === '下雨停工') r++; 
                    if (rec.tips) gTips += rec.tips; 
                } 
            } 
            let finalSalary = wageT + conf.bonus + gTips;
            document.getElementById('total-salary').innerText = '$' + finalSalary.toLocaleString();
            document.getElementById('tips-input').value = '$' + gTips.toLocaleString();
            document.getElementById('stat-full').innerText = `🟢 全: ${f}天`; 
            document.getElementById('stat-half').innerText = `🟡 半: ${h}天`; 
            document.getElementById('stat-rain').innerText = `🌧️ 雨: ${r}天`;
        }

        function changeMonth(dir) { 
            if(isExploding) return; 
            currentMonth += dir; 
            if (currentMonth > 11) { currentMonth = 0; currentYear++; } 
            if (currentMonth < 0) { currentMonth = 11; currentYear--; } 
            
            syncConfigInputs();
            ensureBaseHolidays(currentYear);
            renderCalendar(); 
        }

        function showToast(msg) { 
            const t = document.getElementById('toast'); 
            t.innerText = msg; 
            t.style.opacity = 1; 
            setTimeout(() => { t.style.opacity = 0; }, 1200); 
        }

        init();
    </script>
</body>
</html>
